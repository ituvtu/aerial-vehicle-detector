[project]
name = "aerial-vehicle-detector"
version = "0.1.0"
description = "Sub-500k parameter aerial vehicle detector with range-stratified evaluation (0-200m, 200-400m)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.4.0",
    "opencv-python>=4.10.0.84",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pyyaml>=6.0.2",
    "matplotlib>=3.9.2",
    "scipy>=1.13.1",
    "tqdm>=4.66.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --basetemp=.pytest_tmp"

[tool.uv]
managed = true